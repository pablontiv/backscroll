name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: pablontiv/crossbeam/.github/workflows/go-ci.yml@v2
    with:
      go-version-file: go.mod
      coverage-threshold: 85

  gitleaks:
    uses: pablontiv/crossbeam/.github/workflows/gitleaks.yml@v2

  skill-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test isolated skill installation and recipe retrieval
        run: |
          mkdir -p .local-evidence
          go build -o .local-evidence/backscroll ./cmd/backscroll
          export BACKSCROLL_TEST_BINARY="$PWD/.local-evidence/backscroll"
          python3 tests/test_skill_install.py -v
      - name: "Install-script bash regression suite (issue #74)"
        run: |
          env -u XDG_CONFIG_HOME \
              -u BACKSCROLL_INSTALL_DIR \
              -u BACKSCROLL_CONFIG_DIR \
              -u BACKSCROLL_INPUTS_SOURCE_DIR \
              bash tests/test-install.sh
          env -u XDG_CONFIG_HOME \
              -u BACKSCROLL_INSTALL_DIR \
              -u BACKSCROLL_CONFIG_DIR \
              -u BACKSCROLL_INPUTS_SOURCE_DIR \
              bash tests/test-install-isolation.sh

  candidate-build:
    needs: [ci, gitleaks, skill-install]
    if: github.event_name == 'pull_request'
    uses: >-
      pablontiv/crossbeam/.github/workflows/go-candidate.yml@e0644cd87ffd6123120d45eb807fbb980cc6b8d4
    permissions:
      pull-requests: read
    with:
      source-repository: ${{ github.event.pull_request.head.repo.full_name }}
      source-sha: ${{ github.event.pull_request.head.sha }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      pr-number: ${{ github.event.number }}
      binary-name: backscroll
      go-version: '1.26.2'

  candidate:
    needs: [ci, gitleaks, skill-install, candidate-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Require every candidate gate to succeed
        env:
          CI_RESULT: ${{ needs.ci.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SKILL_INSTALL_RESULT: ${{ needs.skill-install.result }}
          CANDIDATE_BUILD_RESULT: ${{ needs.candidate-build.result }}
        run: |
          set -euo pipefail
          for result in \
            "$CI_RESULT" \
            "$GITLEAKS_RESULT" \
            "$SKILL_INSTALL_RESULT" \
            "$CANDIDATE_BUILD_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::required candidate dependency was $result"
              exit 1
            fi
          done

      - name: Verify candidate artifact identity through REST
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_ID: ${{ needs.candidate-build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.candidate-build.outputs.artifact-digest }}
          ARTIFACT_NAME: ${{ needs.candidate-build.outputs.artifact-name }}
          SOURCE_SHA: ${{ needs.candidate-build.outputs.source-sha }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL%/}/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          ARTIFACT_RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import re

          artifact_id = os.environ["ARTIFACT_ID"]
          digest = os.environ["ARTIFACT_DIGEST"]
          name = os.environ["ARTIFACT_NAME"]
          source_sha = os.environ["SOURCE_SHA"].lower()
          pr_sha = os.environ["PR_SHA"].lower()
          pr_number = os.environ["PR_NUMBER"]
          expected_name = f"go-candidate-pr-{pr_number}-{pr_sha}"
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              raise SystemExit("::error::candidate artifact ID is invalid")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("::error::candidate artifact digest is invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("::error::candidate source SHA is invalid")
          if source_sha != pr_sha or name != expected_name:
              raise SystemExit("::error::candidate outputs do not match the PR")
          try:
              payload = json.loads(os.environ["ARTIFACT_RESPONSE"])
              rest_id = str(payload["id"])
              rest_name = payload["name"]
              rest_digest = payload["digest"]
              rest_sha = payload["workflow_run"]["head_sha"].lower()
              expired = payload["expired"]
          except (AttributeError, KeyError, TypeError,
                  json.JSONDecodeError) as error:
              message = f"::error::invalid artifact REST payload: {error}"
              raise SystemExit(message)
          rest_identity = (
              rest_id, rest_name, rest_digest, rest_sha, expired,
          )
          output_identity = (
              artifact_id, name, digest, source_sha, False,
          )
          if rest_identity != output_identity:
              message = "candidate outputs differ from artifact REST metadata"
              raise SystemExit(f"::error::{message}")
          PY

      - name: Download exact candidate artifact
        # v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate-build.outputs.artifact-id }}
          path: candidate
          merge-multiple: true

      - name: Verify candidate inventory and hashes
        id: inventory
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_VERSION: >-
            ${{ needs.candidate-build.outputs.candidate-version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat

          root = Path("candidate").resolve()
          entries = list(root.iterdir())
          if (len(entries) != 8
                  or any(path.is_symlink() or not path.is_file()
                         or not stat.S_ISREG(
                             path.stat(follow_symlinks=False).st_mode)
                         for path in entries)):
              raise SystemExit("::error::candidate must contain eight files")
          manifest_path = root / "candidate.json"
          checksum_path = root / "checksums.txt"
          if manifest_path not in entries or checksum_path not in entries:
              raise SystemExit("::error::candidate controls are missing")
          manifest = json.loads(manifest_path.read_text())
          expected_keys = {
              "archives", "base", "base_version", "candidate_version",
              "pr", "schema", "sha",
          }
          if not isinstance(manifest, dict) or set(manifest) != expected_keys:
              raise SystemExit("::error::candidate manifest shape is invalid")
          version = os.environ["CANDIDATE_VERSION"]
          source_sha = os.environ["PR_SHA"].lower()
          base_sha = os.environ["BASE_SHA"].lower()
          if not re.fullmatch(
                  r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\."
                  r"(0|[1-9][0-9]*)-pr\.[1-9][0-9]*\.g[0-9a-f]{7}",
                  version):
              raise SystemExit("::error::candidate version is invalid")
          if (manifest["schema"], manifest["pr"], manifest["sha"],
                  manifest["base"], manifest["candidate_version"]) != (
                  1, int(os.environ["PR_NUMBER"]), source_sha, base_sha,
                  version):
              raise SystemExit("::error::candidate manifest identity mismatch")
          if not re.fullmatch(
                  r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\."
                  r"(0|[1-9][0-9]*)", manifest["base_version"]):
              raise SystemExit("::error::candidate base version is invalid")

          matrix = {
              ("linux", "amd64"), ("linux", "arm64"),
              ("darwin", "amd64"), ("darwin", "arm64"),
              ("windows", "amd64"), ("windows", "arm64"),
          }
          archives = manifest["archives"]
          if not isinstance(archives, list) or len(archives) != 6:
              raise SystemExit("::error::candidate archive count is invalid")
          declared = {}
          platforms = set()
          for archive in archives:
              archive_keys = {
                  "file", "goarch", "goos", "name", "sha256",
              }
              if not isinstance(archive, dict) or set(archive) != archive_keys:
                  raise SystemExit("::error::candidate archive shape invalid")
              platform = (archive["goos"], archive["goarch"])
              suffix = ".zip" if archive["goos"] == "windows" else ".tar.gz"
              expected = (
                  f"backscroll_{version}_{archive['goos']}_"
                  f"{archive['goarch']}{suffix}"
              )
              digest = archive["sha256"]
              declaration_invalid = (
                  platform not in matrix
                  or platform in platforms
                  or archive["name"] != "backscroll"
                  or archive["file"] != expected
                  or not re.fullmatch(r"[0-9a-f]{64}", digest)
              )
              if declaration_invalid:
                  raise SystemExit("::error::archive declaration invalid")
              platforms.add(platform)
              declared[expected] = digest
          if platforms != matrix:
              raise SystemExit("::error::candidate target matrix is incomplete")
          expected_files = {"candidate.json", "checksums.txt", *declared}
          if {path.name for path in entries} != expected_files:
              raise SystemExit("::error::candidate file names are not exact")

          checksums = {}
          for line in checksum_path.read_text().splitlines():
              match = re.fullmatch(
                  r"([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)", line
              )
              if not match or match.group(2) in checksums:
                  raise SystemExit("::error::checksum line is invalid")
              checksums[match.group(2)] = match.group(1)
          if checksums != declared:
              raise SystemExit("::error::checksums differ from manifest")
          for filename, expected_digest in declared.items():
              payload = (root / filename).read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              if digest != expected_digest:
                  raise SystemExit("::error::candidate archive hash mismatch")
          linux_archive = f"backscroll_{version}_linux_amd64.tar.gz"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"linux_archive={linux_archive}", file=output)
          PY
          (cd candidate && sha256sum --check --strict checksums.txt)

      - name: Smoke Linux amd64 with isolated SQLite state
        env:
          LINUX_ARCHIVE: ${{ steps.inventory.outputs.linux_archive }}
        run: |
          set -euo pipefail
          smoke_root=$(mktemp -d)
          trap 'rm -rf "$smoke_root"' EXIT
          mkdir -p \
            "$smoke_root/extract" \
            "$smoke_root/home" \
            "$smoke_root/config" \
            "$smoke_root/cache" \
            "$smoke_root/data" \
            "$smoke_root/state" \
            "$smoke_root/db" \
            "$smoke_root/tmp" \
            "$smoke_root/work"
          tar -xzf "candidate/$LINUX_ARCHIVE" -C "$smoke_root/extract"
          binary="$smoke_root/extract/backscroll"
          test -x "$binary"
          output=$(cd "$smoke_root/work" && env -i \
            PATH=/usr/bin:/bin \
            HOME="$smoke_root/home" \
            TMPDIR="$smoke_root/tmp" \
            XDG_CONFIG_HOME="$smoke_root/config" \
            XDG_CACHE_HOME="$smoke_root/cache" \
            XDG_DATA_HOME="$smoke_root/data" \
            XDG_STATE_HOME="$smoke_root/state" \
            BACKSCROLL_CONFIG_DIR="$smoke_root/config" \
            BACKSCROLL_DATABASE_PATH="$smoke_root/db/backscroll.db" \
            "$binary" validate --json)
          jq -e '.valid == true' <<<"$output" >/dev/null
          test -s "$smoke_root/db/backscroll.db"

  release:
    uses: pablontiv/crossbeam/.github/workflows/go-release.yml@v2
    needs: [ci, gitleaks]
    if: github.event_name == 'push'
    with:
      quality-gate-jobs: '["ci","gitleaks"]'
      binary-name: backscroll
    permissions:
      contents: write
      id-token: write
      attestations: write
