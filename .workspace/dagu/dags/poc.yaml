# dagu-feature-bundle: @a4s/omp-dagu@0.3.101 source=pablontiv/a4s@04846df5940d65b8e230eafadff6621ae9186122 bootstrap=bootstrap-backscroll-v0-3-101 dagu=2.20.1
labels:
  - workspace=backscroll
  - dagu-feature-bundle=0.3.101
queue: backscroll
type: graph
dotenv: []
shell: bash
max_active_steps: 1
max_clean_up_time_sec: 120
params:
  type: object
  additionalProperties: true
  properties:
    ISSUE:
      type: string
      minLength: 1
    QUESTION:
      type: string
      default: ""
    BASE_BRANCH:
      type: string
      default: "main"
    OMP_SESSION_ID:
      type: string
      default: ""
    TEST_PATHS:
      type: string
      default: "(^|/)tests/|_test\\.go$|^scripts/test-.*\\.sh$"
  required: [ISSUE]
env:
  - PRIMARY: "/Users/Shared/harness/backscroll"
  - RUN: ${context.run.id}
  - WORKTREE: ${PRIMARY}/.workspace/worktrees/poc-${RUN}
  - DAGU_FEATURE_BUNDLE: "dagu-feature-bundle=0.3.101 source=pablontiv/a4s@04846df5940d65b8e230eafadff6621ae9186122 bootstrap=bootstrap-backscroll-v0-3-101"
  - DAGU_RESOURCE_GUARD: |
      resource_lock() {
        local primary common expected actual attempt
        primary=$(cd "$PRIMARY" && pwd -P)
        common=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)
        [[ "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" == "$common" &&
           "$(cd "$(git -C "$PRIMARY" rev-parse --show-toplevel)" && pwd -P)" == "$primary" &&
           "$RUN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
          { echo 'dagu-feature: PRIMARY must be the main checkout; valid run required' >&2; exit 1; }
        expected="$primary/.workspace/worktrees/poc-$RUN"
        if [[ -e "$WORKTREE" && "$(cd "$WORKTREE" && pwd -P)" == "$primary" ]]; then
          echo "dagu-feature: protected primary or unmanaged target $WORKTREE" >&2; exit 1
        fi
        mkdir -p "$primary/.workspace/worktrees"
        actual="$(cd "$(dirname "$WORKTREE")" && pwd -P)/$(basename "$WORKTREE")"
        if [[ -e "$WORKTREE" ]]; then actual=$(cd "$WORKTREE" && pwd -P); fi
        [[ "$actual" == "$expected" && "$actual" != "$primary" ]] ||
          { echo "dagu-feature: protected primary or unmanaged target $WORKTREE" >&2; exit 1; }
        RESOURCE_LOCK="$common/poc/resource-$RUN.lock"
        mkdir -p "$(dirname "$RESOURCE_LOCK")"
        attempt=0
        until mkdir "$RESOURCE_LOCK" 2>/dev/null; do
          attempt=$((attempt + 1))
          [[ "$attempt" -lt 100 ]] || { echo "dagu-feature: ownership lock unavailable $RESOURCE_LOCK" >&2; exit 1; }
          sleep 0.1
        done
        trap 'rmdir "$RESOURCE_LOCK"' EXIT
        if [[ -e "$WORKTREE" ]]; then
          [[ "$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-common-dir)" == "$common" &&
             "$(git -C "$WORKTREE" branch --show-current)" == "poc/$RUN" &&
             "$(cd "$(git -C "$WORKTREE" rev-parse --show-toplevel)" && pwd -P)" == "$expected" ]] ||
            { echo 'dagu-feature: candidate worktree identity mismatch; preserved' >&2; exit 1; }
        fi
        PRIMARY=$primary WORKTREE=$expected
      }
steps:
  - id: admission
    run: |
      set -euo pipefail
      rejected=$(jq -er 'keys[] | select(. == "GATE" or . == "REBASE_RESOLVER" or . == "REQUIRED_CHECK" or . == "PRIMARY" or . == "BRANCH")' <<<"$DAGU_PARAMS_JSON") || [[ $? == 4 ]]
      if [[ -n "$rejected" ]]; then
        printf 'admission rejected run parameter: %s\n' "$rejected" >&2
        printf 'adopted policy PRIMARY=%q BRANCH=%q\n' "$PRIMARY" "poc/$RUN" >&2
        exit 1
      fi

  - id: record
    depends: admission
    run: |
      set -euo pipefail
      [[ "$RUN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
      [[ "$ISSUE" =~ ^[1-9][0-9]*$ ]]
      cd "$PRIMARY"
      STATE=$(git rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
      mkdir -p "$STATE"
      cat > "$STATE/sections.jq" <<'JQ'
      def norm: gsub("\r\n"; "\n") | gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" ");
      def section($heading):
        reduce (gsub("\r\n"; "\n") | split("\n")[]) as $line
          ({fence:null,active:false,done:false,lines:[]};
           if ($line|test("^ {0,3}(`{3,}|~{3,})")) then
             ($line|capture("^ {0,3}(?<f>`{3,}|~{3,})").f) as $f |
             if .fence == null then .fence = $f
             elif ($f[0:1] == .fence[0:1] and ($f|length) >= (.fence|length)
               and ($line|test("^ {0,3}(`{3,}|~{3,})\\s*$"))) then .fence = null
             else . end |
             if .active then .lines += [$line] else . end
           elif .fence == null and $line == $heading and (.done|not) then .active = true
           elif .fence == null and ($line|test("^## ")) and .active then .active=false | .done=true
           elif .active then .lines += [$line]
           else . end) | .lines | join("\n");
      def marker:
        split("\n")[0] | rtrimstr("\r") |
        capture("^<!-- poc-verdict:(?<verdict>PASS|FAIL|INCONCLUSIVE) scope:(?<scope>OK|FAIL) run:(?<run>[^\\s]+) attempt:(?<attempt>[1-9][0-9]*) base:(?<base>[^\\s]+) -->$");
      JQ
      gh repo view --json nameWithOwner --jq .nameWithOwner > "$STATE/repo"
      printf '%s\n' "$ISSUE" > "$STATE/issue.number"
      gh issue view "$ISSUE" --repo "$(cat "$STATE/repo")" --json body > "$STATE/record-body.json"
      if [[ -z "$QUESTION" ]]; then
        QUESTION=$(jq -er -L "$STATE" 'include "sections"; .body | section("## PoC") | select(norm | length > 0)' "$STATE/record-body.json")
      fi
      test -n "$QUESTION"
      printf '%s\n' "$QUESTION" > "$STATE/question.txt"

  - id: detect_base_primary
    depends: record
    run: |
      set -euo pipefail
      branch=$(git -C "$PRIMARY" branch --show-current)
      status=$(git -C "$PRIMARY" status --porcelain --untracked-files=all)
      if [[ "$branch" != "$BASE_BRANCH" ]]; then
        reason="primary on ${branch:-detached HEAD}, expected $BASE_BRANCH"
      elif [[ -n "$status" ]]; then
        reason="primary dirty: ${status//$'\n'/; }"
      else
        reason=ready
      fi
      printf 'base: %s\n' "$reason" >&2
      printf 'reason=%s\n' "$reason" >> "$DAGU_OUTPUT_FILE"
    outputs:
      - name: reason

  - id: base_primary_unavailable
    depends: detect_base_primary
    continue_on: skipped
    preconditions:
      - condition: "${steps.detect_base_primary.outputs.reason}"
        expected: "re:^primary "
    action: human.task
    with:
      prompt: "base: ${steps.detect_base_primary.outputs.reason}. Restore ${PRIMARY} to clean ${BASE_BRANCH}, preserving the operator's changes; then push back this checkpoint with the observed iteration to recheck in the same run. The DAG records BASE_SHA and creates the worktree."
      push_back:
        rewind_to: detect_base_primary

  - id: base
    depends: base_primary_unavailable
    run: |
      set -euo pipefail
      printf '%s\n' "$DAGU_FEATURE_BUNDLE"
      primary_path=$(cd "$PRIMARY" && pwd -P)
      primary_root=$(cd "$(git -C "$PRIMARY" rev-parse --show-toplevel)" && pwd -P)
      test "$primary_root" = "$primary_path" || { printf 'base: PRIMARY %s resolves to %s, repository root is %s\n' "$PRIMARY" "$primary_path" "$primary_root" >&2; exit 1; }
      test "$(git -C "$PRIMARY" rev-parse --absolute-git-dir)" = "$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-common-dir)"
      test "$(git -C "$PRIMARY" symbolic-ref --short HEAD)" = "$BASE_BRANCH"
      primary_status=$(git -C "$PRIMARY" status --porcelain --untracked-files=all)
      git -C "$PRIMARY" fetch origin || { printf 'base: fetch origin failed; restore origin access and recover this run\n' >&2; exit 1; }
      if [[ -z "$primary_status" ]]; then
        git -C "$PRIMARY" merge --ff-only "origin/$BASE_BRANCH" || true
      fi
      observed_sha=$(git -C "$PRIMARY" rev-parse HEAD)
      expected_sha=$(git -C "$PRIMARY" rev-parse "origin/$BASE_BRANCH")
      observed_version=not-applicable
      expected_version=not-applicable
      manifest=packages/omp-dagu/package.json
      if [[ -e "$PRIMARY/$manifest" ]] || git -C "$PRIMARY" cat-file -e "origin/$BASE_BRANCH:$manifest" 2>/dev/null; then
        observed_version=$(jq -er '.version | select(type == "string" and length > 0)' "$PRIMARY/$manifest" 2>/dev/null) || observed_version=unavailable
        expected_version=$(git -C "$PRIMARY" show "origin/$BASE_BRANCH:$manifest" | jq -er '.version | select(type == "string" and length > 0)') || expected_version=unavailable
      fi
      cause=
      if [[ "$observed_sha" != "$expected_sha" ]]; then
        cause=primary_ahead
        if git -C "$PRIMARY" merge-base --is-ancestor "$observed_sha" "$expected_sha"; then cause=primary_behind; fi
      elif [[ "$observed_version" != "$expected_version" || "$observed_version" == unavailable ]]; then
        cause=version_stale
      fi
      if [[ -n "$cause" ]]; then
        printf 'base: cause=%s observed_sha=%s expected_sha=%s observed_version=%s expected_version=%s; reconcile primary preserving commits\n' \
          "$cause" "$observed_sha" "$expected_sha" "$observed_version" "$expected_version" >&2
        exit 1
      fi
      test -z "$primary_status"
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
      git -C "$PRIMARY" rev-parse HEAD > "$STATE/base.sha"
      printf 'BASE_SHA=%s\n' "$(cat "$STATE/base.sha")" >> "$DAGU_OUTPUT_FILE"
    outputs:
      - name: BASE_SHA

  - id: worktree
    depends: base
    run: |
      set -euo pipefail
      eval "$DAGU_RESOURCE_GUARD"
      resource_lock
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
      git -C "$PRIMARY" check-ignore -q "$WORKTREE"
      if [[ -e "$WORKTREE" ]]; then
        printf 'Reusing %s\n' "$WORKTREE"
      elif git -C "$PRIMARY" show-ref --verify --quiet "refs/heads/poc/$RUN"; then
        git -C "$PRIMARY" worktree add "$WORKTREE" "poc/$RUN"
      else
        git -C "$PRIMARY" worktree add -b "poc/$RUN" "$WORKTREE" "$(cat "$STATE/base.sha")"
      fi
      RESULT=$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-path poc/result.md)
      mkdir -p "$(dirname "$RESULT")"
      printf '%s\n' "$RESULT" > "$STATE/result.path"
      printf 'result=%s\n' "$RESULT"

  - id: run_poc
    depends: worktree
    action: human.task
    with:
      prompt: >-
        Execute minimal commands against the real target in ${WORKTREE}; never push poc/${RUN}.
        Write git rev-parse --git-path poc/result.md with VERDICT: PASS|FAIL|INCONCLUSIVE,
        ## Pregunta, ## Proposición demostrada, ## Ruta ejercitada, ## Comandos y salida,
        and ## Después del PASS for PASS. Record references or digests of every executed
        release/image in Ruta ejercitada. Keep tests and Markdown in the cutover.
        An empty diff is valid. Complete only after recording observed evidence.
      form:
        type: object
        properties:
          decline:
            type: string
            default: ""

  - id: decline
    depends: run_poc
    continue_on: skipped
    preconditions:
      - condition: "${steps.run_poc.outputs.decline}"
        expected: "re:.+"
    env:
      - DECLINE: ${steps.run_poc.outputs.decline}
    run: |
      set -euo pipefail
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
      gh issue comment "$(cat "$STATE/issue.number")" --repo "$(cat "$STATE/repo")" \
        --body "PoC declined by operator: $DECLINE"

  - id: scope_gate
    depends: run_poc
    continue_on:
      failure: true
      skipped: true
    preconditions:
      - condition: "${steps.run_poc.outputs.decline}"
        expected: "re:^$"
    run: |
      set -euo pipefail
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
      printf 'FAIL\n' > "$STATE/scope"
      ATTEMPT=$(cat "$STATE/attempt" 2>/dev/null || printf 0)
      printf '%s\n' "$((ATTEMPT + 1))" > "$STATE/attempt"
      RESULT=$(cat "$STATE/result.path")
      cp "$RESULT" "$STATE/result.md"
      git -C "$WORKTREE" diff --name-only --no-renames -z "$(cat "$STATE/base.sha")" > "$STATE/tracked.paths"
      git -C "$WORKTREE" ls-files --others --exclude-standard -z > "$STATE/untracked.paths"
      while IFS= read -r -d '' path; do
        if [[ "$path" == *.md || "$path" =~ $TEST_PATHS ]]; then
          printf 'Cutover path: %s\n' "$path" | tee "$STATE/scope-errors" >&2
          exit 1
        fi
      done < <(cat "$STATE/tracked.paths" "$STATE/untracked.paths")
      jq -rRs -L "$STATE" --rawfile question "$STATE/question.txt" '
        include "sections";
        . as $result |
        [
          (if (split("\n")[0] | test("^VERDICT: (PASS|FAIL|INCONCLUSIVE)\\r?$")) then empty else "Invalid VERDICT line: expected VERDICT: PASS|FAIL|INCONCLUSIVE" end),
          (["## Pregunta", "## Proposición demostrada", "## Ruta ejercitada", "## Comandos y salida"][] |
            . as $heading | if ($result|section($heading)|norm|length) > 0 then empty else "Missing or empty required section: \($heading)" end),
          (if (section("## Pregunta")|norm) == ($question|norm) then empty else "## Pregunta differs from QUESTION (normalized): result=\(section("## Pregunta")|norm|tojson) QUESTION=\($question|norm|tojson)" end),
          (if (split("\n")[0]|rtrimstr("\r")) == "VERDICT: PASS" and (section("## Después del PASS")|norm|length) == 0 then "Missing or empty ## Después del PASS for PASS" else empty end)
        ] | .[]
      ' "$STATE/result.md" > "$STATE/scope-errors"
      if [[ -s "$STATE/scope-errors" ]]; then
        cat "$STATE/scope-errors" >&2
        exit 1
      fi
      printf 'OK\n' > "$STATE/scope"

  - id: fix_result
    depends: scope_gate
    continue_on: skipped
    preconditions:
      - condition: "${scope_gate.exit_code}"
        expected: "re:^[1-9][0-9]*$"
      - condition: "${steps.run_poc.outputs.decline}"
        expected: "re:^$"
    action: human.task
    with:
      prompt: "Correct result.md using scope_gate stderr, then rerun the experiment in the same worktree."
      push_back:
        rewind_to: run_poc

  - id: publish
    depends: fix_result
    continue_on: skipped
    preconditions:
      - condition: "${steps.run_poc.outputs.decline}"
        expected: "re:^$"
    run: &publish |
      set -euo pipefail
      if jq -e 'has("GATE") or has("REBASE_RESOLVER") or has("REQUIRED_CHECK") or has("PRIMARY") or has("BRANCH")' <<<"${DAGU_PARAMS_JSON:-"{}"}" >/dev/null; then exit 0; fi
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
      test -f "$STATE/issue.number" || exit 0
      REPO=$(cat "$STATE/repo")
      ISSUE=$(cat "$STATE/issue.number")
      BASE_SHA=$(cat "$STATE/base.sha" 2>/dev/null || printf unknown)
      ATTEMPT=$(cat "$STATE/attempt" 2>/dev/null || printf 1)
      SCOPE=$(cat "$STATE/scope" 2>/dev/null || printf FAIL)
      if [[ "${PUBLICATION_FAILURE:-}" == yes ]]; then SCOPE=FAIL; fi
      if [[ -f "$STATE/result.path" && -f "$(cat "$STATE/result.path")" ]]; then
        cp "$(cat "$STATE/result.path")" "$STATE/result.md"
      fi
      VERDICT=$(head -n 1 "$STATE/result.md" 2>/dev/null | tr -d '\r' | cut -d ' ' -f 2 || true)
      case "$VERDICT" in PASS|FAIL|INCONCLUSIVE) ;; *) VERDICT=ORCHESTRATION_FAILURE ;; esac
      printf '%s\n' "$VERDICT" > "$STATE/verdict"
      rm -f "$STATE/comment.url"
      : > "$STATE/full.patch"
      : > "$STATE/diffstat"
      if [[ -d "$WORKTREE" && "$BASE_SHA" != unknown ]]; then
        git -C "$WORKTREE" diff --binary "$BASE_SHA" > "$STATE/full.patch"
        git -C "$WORKTREE" diff --stat "$BASE_SHA" > "$STATE/diffstat"
        while IFS= read -r -d '' path; do
          (cd "$WORKTREE"; git diff --no-index --binary -- /dev/null "$path") >> "$STATE/full.patch" || test "$?" -eq 1
          (cd "$WORKTREE"; git diff --no-index --stat -- /dev/null "$path") >> "$STATE/diffstat" || test "$?" -eq 1
        done < <(git -C "$WORKTREE" ls-files --others --exclude-standard -z)
      fi
      {
        printf '<!-- poc-verdict:%s scope:%s run:%s attempt:%s base:%s -->\n\n' "$VERDICT" "$SCOPE" "$RUN" "$ATTEMPT" "$BASE_SHA"
        if [[ -f "$STATE/result.md" ]]; then cat "$STATE/result.md"; else printf 'Orchestration failure before a capacity verdict.\n'; fi
        printf '\n## Diffstat\n\n```text\n'
        cat "$STATE/diffstat"
        printf '\n```\n\n'
      } > "$STATE/preview"
      {
        cat "$STATE/preview"
        printf '<details>\n<summary>Parche de la PoC</summary>\n\n```diff\n'
        cat "$STATE/full.patch"
        printf '\n```\n</details>\n'
      } > "$STATE/comment-$ATTEMPT.txt"
      if ! URL=$(gh issue comment "$ISSUE" --repo "$REPO" --body-file "$STATE/comment-$ATTEMPT.txt" 2> "$STATE/publish.err"); then
        grep -Ei 'too long|maximum.*characters|body.*large' "$STATE/publish.err"
        jq -cn --arg run "$RUN" --argjson attempt "$ATTEMPT" --rawfile evidence "$STATE/comment-$ATTEMPT.txt" '
          ($evidence|@base64) as $encoded |
          range(0; ($encoded|length); 60000) as $start |
          {kind:"poc-evidence-base64",run:$run,attempt:$attempt,index:($start/60000),data:$encoded[$start:$start+60000]}
        ' > "$STATE/chunks.jsonl"
        : > "$STATE/chunk-links.txt"
        while IFS= read -r chunk; do
          INDEX=$(jq -r '.index' <<< "$chunk")
          printf '%s\n' "$chunk" > "$STATE/chunk.txt"
          LINK=$(gh issue comment "$ISSUE" --repo "$REPO" --body-file "$STATE/chunk.txt")
          printf -- '- [Evidencia completa, parte %s](%s)\n' "$INDEX" "$LINK" >> "$STATE/chunk-links.txt"
        done < "$STATE/chunks.jsonl"
        jq -nr --rawfile preview "$STATE/preview" --rawfile links "$STATE/chunk-links.txt" '
          ($preview[0:8000] + "\n\n[Vista truncada; resultado, diffstat y parche completos en partes enlazadas]\n\n" + $links) |
          if length <= 48000 then . else error("Evidence index exceeds conservative comment limit") end
        ' > "$STATE/fallback-comment.txt"
        URL=$(gh issue comment "$ISSUE" --repo "$REPO" --body-file "$STATE/fallback-comment.txt")
      fi
      printf '%s\n' "$URL" > "$STATE/comment.url"
      if [[ "$VERDICT" == PASS && "$SCOPE" == OK ]]; then
        gh issue view "$ISSUE" --repo "$REPO" --json body > "$STATE/body.json"
        jq -er -L "$STATE" --rawfile result "$STATE/result.md" '
          include "sections";
          ($result|section("## Después del PASS")) as $after |
          if ($after|norm|length) > 0 then .body + "\n\n## Después del PASS\n" + $after
          else error("PASS sin Después del PASS") end
        ' "$STATE/body.json" > "$STATE/disposed-body.txt"
        gh issue edit "$ISSUE" --repo "$REPO" --body-file "$STATE/disposed-body.txt"
      fi

  - id: decide
    depends: publish
    continue_on: skipped
    preconditions:
      - condition: "${steps.run_poc.outputs.decline}"
        expected: "re:^$"
    action: human.task
    with:
      prompt: >-
        Review the published evidence. Push back with --expected-iteration to run_poc
        to iterate; complete with promote=yes only for PASS, otherwise promote=no.
        INCONCLUSIVE requires the operator to choose iteration or finish.
      form:
        type: object
        properties:
          promote:
            type: string
            enum: ['yes', 'no']
        required: [promote]
      push_back:
        rewind_to: run_poc

  - id: dispose
    depends: decide
    continue_on: skipped
    preconditions:
      - condition: "${steps.run_poc.outputs.decline}"
        expected: "re:^$"
    env:
      - PROMOTE: ${steps.decide.outputs.promote}
    run: |
      set -euo pipefail
      STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
      ISSUE=$(cat "$STATE/issue.number")
      REPO=$(cat "$STATE/repo")
      VERDICT=$(cat "$STATE/verdict")
      if [[ "$VERDICT" == PASS && "$PROMOTE" == yes ]]; then
        test "$(cat "$STATE/scope")" = OK
        gh issue view "$ISSUE" --repo "$REPO" --json body > "$STATE/current-body.json"
        gh api --paginate --slurp "repos/$REPO/issues/$ISSUE/comments?per_page=100" > "$STATE/pages.json"
        jq -er -L "$STATE" --slurpfile issue "$STATE/current-body.json" '
          include "sections";
          [ .[][] ] as $comments |
          [$comments[] | . as $c | (.body|marker) as $m | {comment:$c,marker:$m}] |
          (.[-1] // error("No verdict marker")) as $last |
          [$comments[] | .body | fromjson? | select(type == "object") |
            select(.kind == "poc-evidence-base64" and .run == $last.marker.run
              and (.attempt|tostring) == $last.marker.attempt)] as $chunks |
          (if ($chunks|length) > 0 then
            $chunks|sort_by(.index)|map(.data)|join("")|@base64d
           else $last.comment.body end) as $result |
          [$comments[] | select(.body|split("\n")[0]|test("^<!-- poc-triage:yes run:[^\\s]+ -->$"))] as $triages |
          (if ($triages|length) > 0 then $triages[-1].body|section("## Pregunta")|norm
           else $issue[0].body|section("## PoC")|norm end) as $question |
          if $last.marker.verdict == "PASS" and $last.marker.scope == "OK"
            and ($result|marker) == $last.marker
            and $question != "" and $question == ($result|section("## Pregunta")|norm)
            and (["## Pregunta","## Proposición demostrada","## Ruta ejercitada","## Comandos y salida","## Después del PASS"] |
              all(.[]; . as $heading | ($result|section($heading)|norm|length) > 0))
            and ($issue[0].body|section("## Después del PASS")|norm|length) > 0
          then $last.comment.html_url else error("Latest verdict is not a current, complete PASS") end
        ' "$STATE/pages.json" > "$STATE/promotion.url"
        dagu-feature-bundle enqueue --run-id "feature-$RUN" "$PRIMARY/.workspace/dagu/dags/feature.yaml" -- \
          ISSUE="$ISSUE" \
          BASE_BRANCH="$BASE_BRANCH" OMP_SESSION_ID="$OMP_SESSION_ID" \
          POC_BASIS="$(cat "$STATE/promotion.url")"
      else
        test "$PROMOTE" = no
      fi

handler_on:
  wait:
    run: |
      set -euo pipefail
      if [[ ",$DAG_WAITING_STEPS," == *,fix_result,* ]]; then
        STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
        # Dagu persists Waiting only after onWait exits.
        nohup bash -c '
          set -euo pipefail
          RUN=$1
          for attempt in $(seq 1 60); do
            STATUS=$(dagu status poc --run-id "$RUN")
            if grep -q "^Waiting -" <<<"$STATUS"; then
              ITERATION=$(sed -nE "s/.*push-back iteration: ([0-9]+).*/\1/p" <<<"$STATUS" | head -1)
              dagu human-task push-back poc --run-id "$RUN" --step fix_result --expected-iteration "${ITERATION:-0}"
              exit 0
            fi
            sleep 1
          done
          printf "fix_result transition did not reach Waiting; inspect this checkpoint.\n" >&2
          exit 1
        ' _ "$RUN" </dev/null > "$STATE/scope-transition.log" 2>&1 &
      fi
  failure:
    env:
      - PUBLICATION_FAILURE: "yes"
    run: *publish
  exit:
    run: |
      set -euo pipefail
      if jq -e 'has("GATE") or has("REBASE_RESOLVER") or has("REQUIRED_CHECK") or has("PRIMARY") or has("BRANCH")' <<<"${DAGU_PARAMS_JSON:-"{}"}" >/dev/null; then exit 0; fi
      eval "$DAGU_RESOURCE_GUARD"
      resource_lock
      [[ "$RUN" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
      WT="$PRIMARY/.workspace/worktrees/poc-$RUN"
      BRANCH="poc/$RUN"
      WT_REAL="$WT"
      if [[ -d "$WT" ]]; then
        WT_REAL=$(cd "$WT" && pwd -P)
        REMOVE_ARGS=()
        if [[ -n "$(git -C "$WT_REAL" status --porcelain --untracked-files=all)" ]]; then
          STATE=$(git -C "$PRIMARY" rev-parse --path-format=absolute --git-path "poc/runs/$RUN")
          BASE_SHA=$(cat "$STATE/base.sha" 2>/dev/null || printf unknown)
          CURRENT_PATCH=$(mktemp)
          trap 'rm -f "$CURRENT_PATCH"; rmdir "$RESOURCE_LOCK"' EXIT
          if [[ -f "$STATE/full.patch" && -s "$STATE/comment.url" && "$BASE_SHA" != unknown ]] &&
             git -C "$WT_REAL" diff --binary "$BASE_SHA" > "$CURRENT_PATCH"; then
            while IFS= read -r -d '' path; do
              (cd "$WT_REAL"; git diff --no-index --binary -- /dev/null "$path") >> "$CURRENT_PATCH" || test "$?" -eq 1
            done < <(git -C "$WT_REAL" ls-files --others --exclude-standard -z)
            if cmp -s "$CURRENT_PATCH" "$STATE/full.patch"; then
              REMOVE_ARGS=(--force)
            fi
          fi
          if [[ ${#REMOVE_ARGS[@]} -eq 0 ]]; then
            printf 'cleanup retained: worktree %s has unpublished changes; evidence %s\n' "$WT" "$STATE" >&2
            exit 1
          fi
        fi
        git -C "$PRIMARY" worktree remove "${REMOVE_ARGS[@]}" "$WT_REAL"
      fi
      git -C "$PRIMARY" worktree prune
      if git -C "$PRIMARY" show-ref --verify --quiet "refs/heads/$BRANCH"; then
        git -C "$PRIMARY" branch -D "$BRANCH"
      fi
      WORKTREE_LIST=$(git -C "$PRIMARY" worktree list --porcelain)
      if [[ -e "$WT" || -e "$WT_REAL" ]] ||
         grep -Fqx "worktree $WT" <<<"$WORKTREE_LIST" ||
         grep -Fqx "worktree $WT_REAL" <<<"$WORKTREE_LIST"; then
        printf 'cleanup failed: worktree %s remains\n' "$WT" >&2
        exit 1
      fi
      if git -C "$PRIMARY" show-ref --verify --quiet "refs/heads/$BRANCH"; then
        printf 'cleanup failed: branch %s remains\n' "$BRANCH" >&2
        exit 1
      fi
      printf 'cleanup worktree=%s branch=%s\n' "$WT" "$BRANCH"

